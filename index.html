
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport"
          content="width=device-width, initial-scale=1,
                   user-scalable=no, maximum-scale=1">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Yadgir District, Karnataka | GIS Dashboard</title>

    <link rel="stylesheet" href="./resources/ol.css">
    <link rel="stylesheet"
          href="./resources/fontawesome-all.min.css">
    <link rel="stylesheet"
          href="./resources/photon-geocoder-autocomplete.min.css">
    <link rel="stylesheet"
          href="./resources/ol-layerswitcher.css">
    <link rel="stylesheet"
          href="./resources/qgis2web.css">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* OpenLayers controls */
        .ol-control > * {
            background-color: #f8f8f8 !important;
            color: #444444 !important;
            border-radius: 0;
        }

        .ol-attribution a,
        .gcd-gl-input::placeholder,
        .search-layer-input-search::placeholder {
            color: #444444 !important;
        }

        .search-layer-input-search {
            background-color: #f8f8f8 !important;
        }

        .ol-control > *:focus,
        .ol-control > *:hover {
            background-color: rgba(248,248,248,0.7) !important;
        }

        .ol-control {
            background-color: rgba(255,255,255,0.4) !important;
            padding: 2px !important;
        }

        /* Map title */
        .map-title {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255,255,255,0.94);
            color: #173b57;
            padding: 12px 25px;
            font-size: 23px;
            font-weight: bold;
            text-align: center;
            border: 1px solid #527184;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            white-space: nowrap;
            pointer-events: none;
        }

        /* North arrow */
        .north-arrow {
            position: absolute;
            top: 75px;
            right: 18px;
            z-index: 1000;
            width: 48px;
            padding: 5px 0;
            background: rgba(255,255,255,0.94);
            border: 1px solid #666666;
            border-radius: 3px;
            text-align: center;
            pointer-events: none;
        }

        .north-label {
            font-size: 16px;
            font-weight: bold;
            color: #111111;
        }

        .north-symbol {
            font-size: 31px;
            line-height: 31px;
            color: #111111;
        }

        /* Dynamic metric scale bar */
        .ol-scale-line {
            left: 12px !important;
            bottom: 12px !important;
            background: rgba(255,255,255,0.9) !important;
            border: 1px solid #666666;
            border-radius: 3px;
            padding: 5px !important;
        }

        .ol-scale-line-inner {
            color: #222222 !important;
            border-color: #222222 !important;
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        /* Mobile display */
        @media (max-width: 600px) {
            .map-title {
                top: 10px;
                max-width: 72%;
                white-space: normal;
                font-size: 16px;
                padding: 8px 12px;
            }

            .north-arrow {
                top: 65px;
                right: 10px;
            }
        }
    </style>
</head>

<body>

    <div id="map">

        <!-- Dashboard title -->
        <div class="map-title">
            Yadgir District, Karnataka
        </div>

        <!-- North arrow -->
        <div class="north-arrow">
            <div class="north-label">N</div>
            <div class="north-symbol">↑</div>
        </div>

        <!-- Existing popup -->
        <div id="popup" class="ol-popup">
            <a href="#" id="popup-closer"
               class="ol-popup-closer"></a>
            <div id="popup-content"></div>
        </div>

    </div>

    <!-- Existing QGIS2Web scripts -->
    <script src="resources/qgis2web_expressions.js"></script>
    <script src="./resources/functions.js"></script>
    <script src="./resources/ol.js"></script>
    <script src="./resources/ol-layerswitcher.js"></script>
    <script src="resources/photon-geocoder-autocomplete.min.js"></script>
    <script src="resources/olms.js"></script>

    <!-- Existing map layers -->
    <script src="layers/buildings_2.js"></script>
    <script src="layers/Railway_3.js"></script>
    <script src="layers/Roads_4.js"></script>
    <script src="layers/Stream_ydg_5.js"></script>
    <script src="layers/Waterbodies_1_6.js"></script>

    <!-- Existing layer styles -->
    <script src="styles/buildings_2_style.js"></script>
    <script src="styles/Railway_3_style.js"></script>
    <script src="styles/Roads_4_style.js"></script>
    <script src="styles/Stream_ydg_5_style.js"></script>
    <script src="styles/Waterbodies_1_6_style.js"></script>

    <script src="./layers/layers.js"
            type="text/javascript"></script>

    <script src="./resources/Autolinker.min.js"></script>
    <script src="./resources/qgis2web.js"></script>

    <!-- Add scale bar after the map is initialized -->
    <script>
        if (typeof map !== 'undefined' &&
            typeof ol !== 'undefined') {

            var scaleBar = new ol.control.ScaleLine({
                units: 'metric',
                bar: true,
                steps: 4,
                text: true,
                minWidth: 100
            });

            map.addControl(scaleBar);
        }
    </script>

</body>
</html>
